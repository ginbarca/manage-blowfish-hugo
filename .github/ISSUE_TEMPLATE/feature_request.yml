name: Feature request
description: Propose a new capability, reference, example, or agent integration.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Hugo/Blowfish task is difficult or unreliable today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow or resource the skill should add.
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Example prompts or repositories
      description: Use public, sanitized examples only.

  - type: input
    id: upstream
    attributes:
      label: Official upstream documentation
      placeholder: https://blowfish.page/docs/...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request.

