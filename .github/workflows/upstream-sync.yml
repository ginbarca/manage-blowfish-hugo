name: Upstream Sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: npm ci

      - name: Read Blowfish and Hugo upstream state
        run: npm run sync:upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate generated changes
        run: npm test

      - name: Open or update upstream pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: bot/upstream-sync
          delete-branch: true
          commit-message: "chore(upstream): refresh Blowfish and Hugo state"
          title: "chore(upstream): refresh Blowfish and Hugo state"
          body: |
            ## Automated upstream sync

            This pull request was generated after checking current Blowfish and
            Hugo releases and documentation revisions.

            Maintainer checklist:

            - [ ] Read the upstream release notes.
            - [ ] Identify affected files in `skills/manage-blowfish-hugo/references/`.
            - [ ] Update only behavior that changed.
            - [ ] Preserve official source links.
            - [ ] Run `npm test`.
            - [ ] Update English and Vietnamese public docs if user-facing behavior changed.

            This bot intentionally does not auto-merge or overwrite curated skill
            references.
